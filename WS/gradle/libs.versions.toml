
[versions]
kotlin-version = "2.4.10"
ktor-version = "3.5.2"
logback-version = "1.6.3"
kotlinx-serialization-version = "1.11.0"
postgresql-version = "42.7.13"
hikaricp-version = "7.1.0"
koin-version = "4.2.2"
typesafe-config-version = "1.4.9"
junit-version = "6.1.3"
# Keep flyway-version in step with the flyway-database-postgresql literal in the
# buildscript block of build.gradle.kts. Gradle does not expose the version catalog
# inside buildscript {}, so that one coordinate cannot be expressed here.
flyway-version = "13.3.0"
jooq-version = "3.21.7"
jooq-plugin-version = "10.2.1"
spotless-version = "8.10.0"
ktlint-version = "1.8.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor-version" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor-version" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-version" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor-version" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor-version" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-version" }
# junit-bom governs the version of every junit artifact below, so they are declared without one.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-version" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-version" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-version" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor-version" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor-version" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql-version" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp-version" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config-version" }
# koin-bom governs the version of every koin-* artifact below, so they are declared without one.
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-version" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor-version" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway-version" }
jooq = { id = "nu.studer.jooq", version.ref = "jooq-plugin-version" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-version" }
