services:
  db:
    image: postgres:12
    container_name: demo_app_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Demo@123
      POSTGRES_DB: demo
    ports:
      - "54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP. Without it pg_isready probes the unix socket, which the
      # entrypoint's init-time temporary server answers before the real server
      # is listening on TCP — reporting healthy too early on a fresh volume.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
